### Prereqs and MultiPrereqs
Prereqs.SilencioMTT_MultiPrereq_ThrowANDUndetectedCrouch:
  aggregationType: AND
  nestedPrereqs:
    - Perks.IsPlayerOutOfCombatOrInStealthPSMState
    - NewPerks.IsPlayerCrouchingOrCrouchSprintingPrereq
    - Prereqs.SilencioMTT_ThrowAttackPrereq
  prereqClassName: gameMultiPrereq
  $type: gamedataMultiPrereq_Record


Prereqs.SilencioMTT_MultiPrereq_VanillaMeleeMod3: # Recreate MeleeMod3's prereq to avoid using inlines
  aggregationType: AND
  nestedPrereqs:
    - Perks.IsPlayerOutOfCombatOrInStealthPSMState
    - NewPerks.IsPlayerCrouchingOrCrouchSprintingPrereq
  prereqClassName: gameMultiPrereq
  $type: gamedataMultiPrereq_Record

Prereqs.SilencioMTT_MultiPrereq_VanillaMeleeMod3ORThrow:
  aggregationType: OR
  nestedPrereqs:
    - Prereqs.SilencioMTT_MultiPrereq_VanillaMeleeMod3
    - Prereqs.SilencioMTT_MultiPrereq_ThrowANDUndetectedCrouch
  prereqClassName: gameMultiPrereq
  $type: gamedataMultiPrereq_Record

Prereqs.SilencioMTT_ThrowAttackPrereq:
  isInState: True
  prereqClassName: MeleeWeaponPSMPrereq
  previousState: False
  stateName: ThrowAttack
  $type: gamedataIPrereq_Record
 

### StatusEffect
BaseStatusEffect.SilencioMTT_BSE:
  debugTags: []
  duration: 
    $type: gamedataStatModifierGroup_Record
    drawBasedOnStatType: False
    optimiseCombinedModifiers: False
    relatedModifierGroups: []
    saveBasedOnStatType: False
    statModifiers:
      - $type: gamedataConstantStatModifier_Record
        modifierType: Additive
        statType: BaseStats.MaxDuration
        value: 2
    statModsLimit: -1
  dynamicDuration: False
  gameplayTags: []
  immunityStats: []
  isAffectedByTimeDilationNPC: True
  isAffectedByTimeDilationPlayer: True
  maxStacks: RTDB.StatusEffect_inline0
  packages:
    - GLP.SilencioMTT_BSE_Package
  reapplyPackagesOnMaxStacks: False
  removeAllStacksWhenDurationEnds: False
  removeOnStoryTier: False
  replicated: False
  savable: True
  SFX: []
  statusEffectType: BaseStatusEffectTypes.Misc
  stopActiveSfxOnDeactivate: True
  $type: gamedataStatusEffect_Record
  VFX: []
  

